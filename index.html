<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCE Examination Service</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<style>
  * {
    padding: 0;
    margin: 0;
    font-family: Verdana;
  }

  .start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    padding: 30px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
    font-family: Arial, sans-serif;
  }

  .start h1 {
    margin-bottom: 15px;
    font-size: 24px;
    color: #333;
  }

  .start p {
    margin-bottom: 20px;
    color: #666;
    font-size: 16px;
  }

  .start input,
  .start select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: border 0.3s;
    margin-bottom: 20px;
    box-sizing: border-box;
  }

  .start input:focus,
  .start select:focus {
    border-color: #007bff;
  }

  .start button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  .start button:hover {
    background: #0056b3;
    transform: translateY(-2px);
  }

  .start button:active {
    background: #00408f;
    transform: translateY(0);
  }

  .exam {
    display: grid;
    grid-template-rows: 70px 1fr;
    grid-template-columns: 220px 1fr 250px;
    height: 100vh;
    width: 100vw;
    background: #f7f9fc;
    display: none;
    font-family: Verdana, Arial, sans-serif;
  }

  header {
    grid-column: 1 / 4;
    background: #0056b3;
    color: white;
    font-size: 1.8em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
  }

  .sidebar {
    background: #fff;
    border-right: 1px solid #ddd;
    padding: 15px;
    overflow-y: auto;
  }

  .sidebar h3 {
    margin-bottom: 10px;
    font-size: 1.2em;
    color: #333;
  }

  .number {
    width: 40px;
    height: 40px;
    margin: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #e4e7eb;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s;
  }

  .number:hover {
    background: #007bff;
    color: #fff;
  }

  .questions {
    padding: 30px;
  }

  .question-card {
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  }

  .question-card h2 {
    margin-bottom: 20px;
    font-size: 1.4em;
    color: #222;
  }

  .option {
    display: block;
    margin: 10px 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .option:hover {
    background: #f0f4ff;
    border-color: #007bff;
  }

  /* Code-style text (tags like <a href='#'>) */
  .option code,
  .question-card code,
  .review-card code {
    font-family: Consolas, "Courier New", monospace;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .rightpanel {
    background: #fff;
    border-left: 1px solid #ddd;
    padding: 20px;
  }

  .rightpanel h3 {
    margin-bottom: 15px;
    color: #333;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    margin-top: 20px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .submit-btn:hover {
    background: #0056b3;
  }

  .nav-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
  }

  .nav-btn {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  .prev-btn {
    background: #6c757d;
    color: white;
  }

  .prev-btn:hover {
    background: #5a6268;
    transform: translateY(-2px);
  }

  .next-btn {
    background: #28a745;
    color: white;
  }

  .next-btn:hover {
    background: #218838;
    transform: translateY(-2px);
  }

  .success-page {
    min-height: 100vh;
    width: 100%;
    display: none;
    background: #f8fafc;
    color: #1e293b;
    overflow-y: auto;
    flex-direction: column;
  }

  .results-hero {
    background: white;
    padding: 60px 20px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .results-content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px;
    width: 100%;
    box-sizing: border-box;
  }

  .score-visual-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .score-circle-wrapper {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .circular-progress {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: conic-gradient(#3b82f6 0deg, #f1f5f9 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .circular-progress::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: white;
    border-radius: 50%;
  }

  .progress-value {
    position: relative;
    font-size: 48px;
    font-weight: 800;
    color: #1e293b;
  }

  .score-details {
    text-align: left;
  }

  .remark-text {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .score-stats {
    font-size: 18px;
    color: #64748b;
    margin-bottom: 24px;
  }

  .exit-btn {
    background: #1e293b;
    color: white;
    border: none;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .exit-btn:hover {
    background: #334155;
    transform: translateY(-2px);
  }

  .review-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 40px;
  }

  .review-card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #e2e8f0;
    transition: transform 0.2s;
  }

  .review-card:hover {
    transform: translateX(4px);
  }

  .review-card.correct {
    border-left: 6px solid #10b981;
  }

  .review-card.incorrect {
    border-left: 6px solid #ef4444;
  }

  .question-text {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .answer-comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .ans-box {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 15px;
  }

  .ans-box label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
    color: #64748b;
  }

  .ans-box.user {
    background: #f8fafc;
  }

  .ans-box.correct {
    background: #f0fdf4;
    color: #166534;
  }

  .ans-box.wrong {
    background: #fef2f2;
    color: #991b1b;
  }

  @media (max-width: 640px) {
    .score-visual-row {
      flex-direction: column;
      gap: 30px;
    }

    .score-details {
      text-align: center;
    }

    .answer-comparison {
      grid-template-columns: 1fr;
    }
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }

  .modal-card {
    background: white;
    width: 90%;
    max-width: 450px;
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    text-align: center;
    animation: modalBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  @keyframes modalBounce {
    from {
      transform: scale(0.8) translateY(30px);
      opacity: 0;
    }

    to {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
  }

  .modal-card h2 {
    color: #0f172a;
    margin-bottom: 24px;
    font-size: 26px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .modal-message {
    margin-bottom: 30px;
    text-align: left;
  }

  .msg-en {
    font-size: 17px;
    color: #334155;
    font-weight: 600;
    margin-bottom: 15px;
    padding-left: 10px;
    border-left: 4px solid #3b82f6;
    line-height: 1.5;
  }

  .msg-hi {
    font-size: 17px;
    color: #475569;
    background: #f8fafc;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    line-height: 1.6;
    font-weight: 500;
  }

  .modal-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 45px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
  }

  .modal-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
  }

  .modal-btn:active {
    transform: translateY(0);
  }

  .nav-btn:disabled,
  .submit-btn:disabled {
    background: #9ca3af !important;
    cursor: not-allowed;
    opacity: 0.7;
    transform: none !important;
  }

  .submit-btn-final {
    background: #dc3545;
    color: #fff;
  }

  .submit-btn-final:hover {
    background: #b02a37;
  }

  #submit-hint {
    margin-top: 10px;
    font-size: 13px;
    color: #b45309;
    text-align: center;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .modal-btn.secondary {
    background: #e2e8f0;
    color: #1e293b;
    box-shadow: none;
  }

  .modal-btn.secondary:hover {
    background: #cbd5e1;
  }

  .modal-actions .modal-btn {
    padding: 14px 24px;
  }
</style>

<body>
  <div id="start" class="start">
    <h1>VCE Examination Portal</h1>
    <p>Select Branch and Enter Roll Number</p>
    <select id="branch-select">
      <option value="">Select Branch</option>
      <option value="main">Main Branch</option>
      <option value="second">Second Branch</option>
      <option value="third">Third Branch</option>
    </select>
    <input id="roll-input" type="text" placeholder="Roll Number" />
    <input id="exam-id-input" type="text" placeholder="Exam ID" readonly />
    <button id="start-exam">Start Exam</button>
  </div>

  <div id="exam" class="exam">
    <header>
      <p id="timer">⏳ 30:00</p>
    </header>

    <div class="sidebar">
      <h3>Questions</h3>
    </div>

    <div class="questions">
      <div class="question-card"></div>
      <div class="nav-buttons">
        <button class="nav-btn prev-btn">⬅ Previous</button>
        <button class="nav-btn next-btn">Next ➡</button>
      </div>
    </div>

    <div class="rightpanel">
      <div id="candidate-info">
        <h3>Candidate Info</h3>
        <p><b>Name:</b> Loading...</p>
        <p><b>Roll No:</b> Loading...</p>
        <p><b>Status:</b> Active</p>
      </div>
      <button class="submit-btn">Submit Exam</button>
      <p id="submit-hint"></p>
    </div>
  </div>

  <div id="success" class="success-page"></div>

  <div id="fee-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>⚠️ Attention / ध्यान दें</h2>
      <div class="modal-message">
        <p id="modal-msg-en" class="msg-en"></p>
        <p id="modal-msg-hi" class="msg-hi"></p>
      </div>
      <button class="modal-btn" onclick="closeFeeModal()">OK / ठीक है</button>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>❓ Please Confirm / कृपया पुष्टि करें</h2>
      <div class="modal-message">
        <p id="confirm-msg-en" class="msg-en"></p>
        <p id="confirm-msg-hi" class="msg-hi"></p>
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="confirm-no">No, Go Back / नहीं, वापस जाएँ</button>
        <button class="modal-btn" id="confirm-yes">Yes / हाँ</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hkpjhckamtfecspbacla.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrcGpoY2thbXRmZWNzcGJhY2xhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTAxNzksImV4cCI6MjEwNTAyNjE3OX0.e4B5bnL4uC3oC2ym7EZvKnh_eJApj6nTJGso7GQLVvM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let currentUser = null;
    let currentExamId = "";
    let examSubmitted = false;
    let timerInterval = null;
    let examTotalSecs = 0;
    let remainingSecs = 0;
    let confirmCallback = null;
    let resultsShown = false;

    // ---------- Text helpers ----------

    // Escape HTML so tags like <a href='#'> are shown as plain text
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Escape first, then turn "/n" markers into line breaks
    function formatText(text) {
      if (!text) return "";
      return escapeHTML(text).split("/n").join("<br>");
    }

    function toTitleCase(str) {
      if (!str) return "";
      return str.replace(/\w\S*/g, function (txt) {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
      });
    }

    // True if the text contains something that looks like an HTML tag
    function looksLikeCode(text) {
      return /<[^>]+>/.test(text || "");
    }

    async function translateText(text, targetLang = 'hi') {
      if (!text) return "";
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (error) {
        console.error("Translation error:", error);
        return text;
      }
    }

    // Don't translate text that contains code/tags (Google would translate tag names)
    async function smartTranslate(text, targetLang = 'hi') {
      if (looksLikeCode(text)) return text;
      return translateText(text, targetLang);
    }

    // Show Hindi + English together only when they actually differ
    function bilingual(hi, en) {
      if (!hi || hi === en) {
        return `<code>${formatText(en)}</code>`;
      }
      return `${formatText(hi)} (${formatText(en)})`;
    }

    // ---------- Modals ----------

    function showFeeStatusModal(en, hi) {
      document.getElementById("modal-msg-en").textContent = en;
      document.getElementById("modal-msg-hi").textContent = hi;
      document.getElementById("fee-modal").style.display = "flex";
    }

    window.closeFeeModal = function () {
      document.getElementById("fee-modal").style.display = "none";
    };

    function showConfirmModal(en, hi, onYes) {
      document.getElementById("confirm-msg-en").textContent = en;
      document.getElementById("confirm-msg-hi").textContent = hi;
      confirmCallback = onYes;
      document.getElementById("confirm-modal").style.display = "flex";
    }

    function hideConfirmModal() {
      document.getElementById("confirm-modal").style.display = "none";
      confirmCallback = null;
    }

    document.getElementById("confirm-no").addEventListener("click", hideConfirmModal);
    document.getElementById("confirm-yes").addEventListener("click", () => {
      const cb = confirmCallback;
      hideConfirmModal();
      if (cb) cb();
    });

    // ---------- Submit lock ----------

    function isSubmitUnlocked() {
      return examTotalSecs > 0 && (examTotalSecs - remainingSecs) >= examTotalSecs / 4;
    }

    function updateSubmitButtons() {
      if (examSubmitted) return;
      const unlocked = isSubmitUnlocked();

      document.querySelectorAll(".submit-btn, .submit-btn-final").forEach(btn => {
        btn.disabled = !unlocked;
      });

      const hint = document.getElementById("submit-hint");
      if (hint) {
        if (unlocked) {
          hint.textContent = "";
        } else {
          const secsLeft = Math.ceil(examTotalSecs / 2) - (examTotalSecs - remainingSecs);
          const m = Math.floor(secsLeft / 60);
          const s = secsLeft % 60;
          const t = `${m}:${s < 10 ? "0" : ""}${s}`;
          hint.innerHTML = `Submit unlocks in ${t}<br>सबमिट ${t} बाद उपलब्ध होगा`;
        }
      }
    }

    function requestSubmit() {
      if (examSubmitted) return;

      if (!isSubmitUnlocked()) {
        showFeeStatusModal(
          "You can submit the exam only after half of the exam time has passed.",
          "आप परीक्षा तभी जमा कर सकते हैं जब परीक्षा का आधा समय बीत जाए।"
        );
        return;
      }

      const unanswered = allQuestions.length - userAnswers.filter(Boolean).length;
      const extraEn = unanswered > 0 ? ` You have ${unanswered} unanswered question(s).` : "";
      const extraHi = unanswered > 0 ? ` आपके ${unanswered} प्रश्न बिना उत्तर के हैं।` : "";

      showConfirmModal(
        `Are you completely sure you want to submit your answers?${extraEn} You cannot change them after submitting.`,
        `क्या आप पूरी तरह निश्चित हैं कि आप अपने उत्तर जमा करना चाहते हैं?${extraHi} जमा करने के बाद आप उन्हें बदल नहीं सकेंगे।`,
        () => submitExam()
      );
    }

    function confirmLeaveResults() {
      showConfirmModal(
        "Have you properly reviewed your answers and score? If you continue, this results page will be closed and you cannot view it again.",
        "क्या आपने अपने उत्तरों और स्कोर को ठीक से देख लिया है? आगे बढ़ने पर यह परिणाम पेज बंद हो जाएगा और आप इसे दोबारा नहीं देख पाएँगे।",
        () => {
          resultsShown = false;
          location.reload();
        }
      );
    }

    function enableResultsGuards() {
      resultsShown = true;

      history.pushState({ results: true }, "", location.href);
      window.addEventListener("popstate", () => {
        if (!resultsShown) return;
        history.pushState({ results: true }, "", location.href);
        confirmLeaveResults();
      });

      window.addEventListener("keydown", (e) => {
        if (!resultsShown) return;
        const isRefresh = e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r");
        if (isRefresh) {
          e.preventDefault();
          confirmLeaveResults();
        }
      });

      window.addEventListener("beforeunload", (e) => {
        if (!resultsShown) return;
        e.preventDefault();
        e.returnValue = "";
      });
    }

    function resetStartButton(btn, text) {
      btn.disabled = false;
      btn.textContent = text;
      btn.style.background = "#007bff";
    }

    // ---------- Fee verification ----------

    async function verifyStudentFeeStatus(rollNumber, branch = "all") {
      try {
        const { data, error } = await supabaseClient.rpc("get_student_fee_status", {
          p_branch: branch,
          p_search: rollNumber,
          p_only_pending: false,
          p_limit: 10,
          p_offset: 0,
        });

        if (error) throw error;

        const student = data?.find(
          (r) => String(r.roll_number).trim() === String(rollNumber).trim()
        );

        if (!student) {
          return {
            exists: false,
            isCleared: false,
            message: "Roll number not found in fee records."
          };
        }

        const status = student.status || "";
        const isCleared = status.includes("UP") || status.includes("COURSE-COMPLETED");

        return {
          exists: true,
          isCleared: isCleared,
          currentStatus: status,
          details: student
        };
      } catch (err) {
        console.error("Verification error:", err);
        throw err;
      }
    }

    // ---------- Start screen ----------

    document.getElementById("branch-select").addEventListener("change", async (e) => {
      const branch = e.target.value;
      const examInput = document.getElementById("exam-id-input");
      examInput.value = "";
      examInput.placeholder = "Loading Exam...";

      if (!branch) {
        examInput.placeholder = "Exam ID";
        return;
      }

      try {
        const { data: examId, error } = await supabaseClient.rpc("get_current_exam", { p_branch: branch });
        if (error) throw error;

        if (examId) {
          examInput.value = examId;
          examInput.placeholder = "Exam ID";
        } else {
          examInput.placeholder = "No exam found for this branch";
        }
      } catch (err) {
        console.error("Error fetching exam:", err);
        examInput.placeholder = "Error loading exam";
      }
    });

    document.getElementById("start-exam").addEventListener("click", async () => {
      const startBtn = document.getElementById("start-exam");
      const branch = document.getElementById("branch-select").value;
      const roll = document.getElementById("roll-input").value.trim();
      const examId = document.getElementById("exam-id-input").value.trim();

      if (!branch || !roll || !examId) {
        alert("Please select branch and enter roll number (Exam ID must be loaded)");
        return;
      }

      const formattedId = `${branch.charAt(0).toLowerCase()}_${roll}`;
      const originalText = startBtn.textContent;
      startBtn.disabled = true;
      startBtn.textContent = "Verifying...";
      startBtn.style.background = "grey";

      try {
        const { data: gate, error: gateErr } = await supabaseClient.rpc("get_exam_gate", { p_exam_id: examId });
        if (gateErr) throw gateErr;

        if (!gate || !gate.found) {
          alert("This exam could not be found. Please select your branch again.");
          resetStartButton(startBtn, originalText);
          return;
        }

        if (!gate.is_open) {
          const opTimeStr = new Date(gate.operational_time).toLocaleString();
          showFeeStatusModal(
            `This exam is not open yet. It will become available on ${opTimeStr}. Please come back then.`,
            `यह परीक्षा अभी शुरू नहीं हुई है। यह ${opTimeStr} पर उपलब्ध होगी। कृपया उस समय पुनः प्रयास करें।`
          );
          resetStartButton(startBtn, originalText);
          return;
        }

        if (gate.restricted) {
          const feeResult = await verifyStudentFeeStatus(formattedId, branch);

          if (!feeResult.exists) {
            showFeeStatusModal(
              "Roll number not found in fee records. Please check your details.",
              "फीस रिकॉर्ड में रोल नंबर नहीं मिला। कृपया अपने विवरण की जाँच करें।"
            );
            resetStartButton(startBtn, originalText);
            return;
          }

          if (!feeResult.isCleared) {
            showFeeStatusModal(
              `Academic Dues Pending! Your current status is: ${feeResult.currentStatus}. Please clear your dues to proceed.`,
              `अकादमिक बकाया लंबित है! आपकी वर्तमान स्थिति है: ${feeResult.currentStatus}। आगे बढ़ने के लिए कृपया अपना बकाया जमा करें।`
            );
            resetStartButton(startBtn, originalText);
            return;
          }
        }

        const { data: started, error: startErr } = await supabaseClient.rpc("start_exam", {
          p_roll_number: formattedId,
          p_exam_id: examId,
        });
        if (startErr) throw startErr;

        switch (started?.status) {
          case "ok":
            break;
          case "student_not_found":
            alert("Student profile not found. Please contact administration.");
            resetStartButton(startBtn, originalText);
            return;
          case "already_submitted":
            showFeeStatusModal(
              "You have already submitted this exam.",
              "आप यह परीक्षा पहले ही जमा कर चुके हैं।"
            );
            resetStartButton(startBtn, originalText);
            return;
          case "not_open":
            showFeeStatusModal(
              "This exam is not open yet. Please come back later.",
              "यह परीक्षा अभी शुरू नहीं हुई है। कृपया बाद में पुनः प्रयास करें।"
            );
            resetStartButton(startBtn, originalText);
            return;
          case "no_questions":
            alert("No questions have been added to this exam yet. Please contact administration.");
            resetStartButton(startBtn, originalText);
            return;
          default:
            alert("This exam could not be started. Please contact administration.");
            resetStartButton(startBtn, originalText);
            return;
        }

        const student = started.student;
        currentUser = student;
        currentExamId = started.exam.exam_id;
        examSubmitted = false;
        userAnswers = [];

        document.getElementById("candidate-info").innerHTML = `
      <h3>Candidate Info</h3>
      <p><b>Roll Number:</b> ${escapeHTML(student.roll_number)}</p>
      <p><b>Student Name:</b> ${escapeHTML(toTitleCase(student.student_name))}</p>
      <p><b>Father Name:</b> ${escapeHTML(toTitleCase(student.father_name))}</p>
      <p><b>Course:</b> ${escapeHTML(toTitleCase(student.course))}</p>
      <p><b>Batch Time:</b> ${escapeHTML(toTitleCase(student.batch_time))}</p>
      <p><b>Exam ID:</b> ${escapeHTML(currentExamId || 'N/A')}</p>
      <p><b>Status:</b> Active</p>
    `;

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => { });
        }

        document.getElementById("start").style.display = "none";
        document.getElementById("exam").style.display = "grid";
        document.querySelector(".questions").innerHTML =
          '<div class="question-card"><h2>Loading questions...</h2></div>';

        const duration = started.exam.duration_mins || 30;

        await prepareQuestions(started.questions);
        renderQuestion(0);
        startTimer(duration);

      } catch (err) {
        console.error("Verification error:", err);
        alert("Something went wrong. Please try again.");
        resetStartButton(startBtn, originalText);
      }
    });

    // ---------- Questions ----------

    async function prepareQuestions(rawQuestions) {
      allQuestions = await Promise.all(rawQuestions.map(async (q) => {
        const questionHi = await smartTranslate(q.question_text.split("/n").join(" "));

        const options = await Promise.all(q.options.map(async (opt) => ({
          id: opt.option_id,
          text_en: opt.option_text,
          text_hi: await smartTranslate(opt.option_text.split("/n").join(" "))
        })));

        return {
          id: q.question_id,
          question_en: q.question_text,
          question_hi: questionHi,
          options
        };
      }));

      renderSidebar();
    }

    function renderSidebar() {
      const sidebar = document.querySelector(".sidebar");
      sidebar.innerHTML = "<h3>Questions</h3>";
      allQuestions.forEach((_, idx) => {
        const numDiv = document.createElement("div");
        numDiv.className = "number";
        numDiv.textContent = idx + 1;
        numDiv.addEventListener("click", () => renderQuestion(idx));
        sidebar.appendChild(numDiv);
      });
      updateSidebarHighlight();
    }

    function renderQuestion(index) {
      currentIndex = index;
      const qDiv = document.querySelector(".questions");
      const q = allQuestions[index];
      const isLast = index === allQuestions.length - 1;

      // Show the Hindi line only if it is different from the English one
      const showHiQuestion = q.question_hi && q.question_hi !== q.question_en;

      qDiv.innerHTML = `
    <div class="question-card">
      <h2>Q${index + 1}. ${formatText(q.question_en)}</h2>
      ${showHiQuestion
          ? `<h3 style="color:#555; font-weight:normal; margin-top:10px;">${formatText(q.question_hi)}</h3>`
          : ""}
      ${q.options.map(opt => `
        <label class="option">
          <input type="radio" name="q${index}" value="${escapeHTML(opt.id)}">
          ${bilingual(opt.text_hi, opt.text_en)}
        </label>`).join('')}
    </div>
    <div class="nav-buttons">
      <button class="nav-btn prev-btn" ${index === 0 ? "disabled" : ""}>⬅ Previous</button>
      ${isLast
          ? '<button class="nav-btn submit-btn-final">Submit Exam</button>'
          : '<button class="nav-btn next-btn">Next ➡</button>'}
    </div>
  `;

      if (userAnswers[index]) {
        qDiv.querySelectorAll('input[type="radio"]').forEach(radio => {
          if (radio.value === String(userAnswers[index])) radio.checked = true;
        });
      }

      qDiv.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener("change", () => {
          userAnswers[index] = input.value;
        });
      });

      qDiv.querySelector(".prev-btn").addEventListener("click", () => renderQuestion(currentIndex - 1));
      if (!isLast) {
        qDiv.querySelector(".next-btn").addEventListener("click", () => renderQuestion(currentIndex + 1));
      } else {
        qDiv.querySelector(".submit-btn-final").addEventListener("click", requestSubmit);
      }

      updateSidebarHighlight();
      updateSubmitButtons();
    }

    function updateSidebarHighlight() {
      const numbers = document.querySelectorAll(".number");
      numbers.forEach((num, idx) => {
        num.style.background = idx === currentIndex ? "#007bff" : "#e4e7eb";
        num.style.color = idx === currentIndex ? "#fff" : "#000";
      });
    }

    // ---------- Timer ----------

    function startTimer(durationInMinutes) {
      examTotalSecs = durationInMinutes * 60;
      remainingSecs = examTotalSecs;
      const timerDisplay = document.getElementById("timer");

      clearInterval(timerInterval);
      updateSubmitButtons();

      timerInterval = setInterval(() => {
        const mins = Math.floor(remainingSecs / 60);
        const secs = remainingSecs % 60;
        timerDisplay.textContent = `⏳ ${mins}:${secs < 10 ? "0" : ""}${secs}`;

        if (remainingSecs <= 0) {
          clearInterval(timerInterval);
          hideConfirmModal();
          submitExam();
          return;
        }
        remainingSecs--;
        updateSubmitButtons();
      }, 1000);
    }

    // ---------- Submit ----------

    async function submitExam() {
      if (examSubmitted) return;
      examSubmitted = true;

      document.querySelectorAll(".submit-btn, .submit-btn-final").forEach(btn => {
        btn.disabled = true;
        btn.textContent = "Submitting...";
        btn.style.background = "grey";
      });

      const answers = allQuestions.map((q, i) => ({
        question_id: q.id,
        option_id: userAnswers[i] || null
      }));

      try {
        const { data: result, error } = await supabaseClient.rpc("submit_exam", {
          p_roll_number: currentUser.roll_number,
          p_exam_id: currentExamId,
          p_answers: answers
        });
        if (error) throw error;

        if (result.status === "already_submitted") {
          clearInterval(timerInterval);
          alert("This exam has already been submitted for your roll number.");
          location.reload();
          return;
        }
        if (result.status !== "ok") {
          throw new Error("Submit failed: " + result.status);
        }

        clearInterval(timerInterval);
        renderResultsDashboard(result);
        enableResultsGuards();
        document.getElementById("exam").style.display = "none";
        document.getElementById("success").style.display = "flex";
      } catch (err) {
        console.error("Submission error:", err);
        alert("Couldn't submit your exam. Please check your connection and try again.");

        examSubmitted = false;
        document.querySelectorAll(".submit-btn, .submit-btn-final").forEach(btn => {
          btn.disabled = false;
          btn.textContent = "Submit Exam";
          btn.style.background = "";
        });
        updateSubmitButtons();
      }
    }

    // ---------- Results ----------

    function renderResultsDashboard(result) {
      const container = document.getElementById("success");
      const score = result.score;
      const total = result.out_of || allQuestions.length;
      const percentage = total > 0 ? (score / total) * 100 : 0;

      const correctMap = {};
      (result.review || []).forEach(r => { correctMap[r.question_id] = r.correct_option_id; });

      let remark = "";
      let remarkColor = "";
      if (percentage === 100) { remark = "Perfect! ⚖️"; remarkColor = "#10b981"; }
      else if (percentage >= 80) { remark = "Excellent Work! 🌟"; remarkColor = "#3b82f6"; }
      else if (percentage >= 60) { remark = "Good Effort! 👍"; remarkColor = "#f59e0b"; }
      else { remark = "Need Hardwork! 💪"; remarkColor = "#ef4444"; }

      let reviewCards = allQuestions.map((q, i) => {
        const correctId = correctMap[q.id];
        const userOpt = q.options.find(o => o.id === userAnswers[i]);
        const correctOpt = q.options.find(o => o.id === correctId);
        const isCorrect = !!userOpt && userOpt.id === correctId;

        const userAns = userOpt ? userOpt.text_en : "Not Answered";
        const correctAns = correctOpt ? correctOpt.text_en : "";

        // Hindi line only when it differs from English (i.e. not code)
        const userAnsHi = userOpt && userOpt.text_hi !== userOpt.text_en ? userOpt.text_hi : "";
        const correctAnsHi = correctOpt && correctOpt.text_hi !== correctOpt.text_en ? correctOpt.text_hi : "";
        const questionHi = q.question_hi && q.question_hi !== q.question_en ? q.question_hi : "";

        return `
      <div class="review-card ${isCorrect ? 'correct' : 'incorrect'}">
        <div class="question-text">${i + 1}. ${formatText(q.question_en)}</div>
        ${questionHi
            ? `<div class="question-text-hi" style="color: #64748b; font-size: 16px; margin-top: -12px; margin-bottom: 20px; font-weight: 500; font-family: Arial, sans-serif;">${formatText(questionHi)}</div>`
            : ""}
        <div class="answer-comparison">
          <div class="ans-box user ${isCorrect ? 'correct' : 'wrong'}">
            <label>Your Answer</label>
            <div style="font-weight: 700;">${formatText(userAns)}</div>
            <div style="font-size: 13px; margin-top: 4px; opacity: 0.8;">${formatText(userAnsHi)}</div>
          </div>
          <div class="ans-box correct">
            <label>Correct Answer</label>
            <div style="font-weight: 700;">${formatText(correctAns)}</div>
            <div style="font-size: 13px; margin-top: 4px; opacity: 0.8;">${formatText(correctAnsHi)}</div>
          </div>
        </div>
      </div>
    `;
      }).join('');

      container.innerHTML = `
    <div class="results-hero">
      <div class="score-visual-row">
        <div class="score-circle-wrapper">
          <div class="circular-progress" id="progress-circle">
            <span class="progress-value">0%</span>
          </div>
        </div>
        <div class="score-details">
          <div class="remark-text" style="color: ${remarkColor}">${remark}</div>
          <div class="score-stats">
            You got <strong>${score}</strong> out of <strong>${total}</strong> questions correct.
          </div>
          <button class="exit-btn" onclick="confirmLeaveResults()">Back to Home</button>
        </div>
      </div>
    </div>

    <div class="results-content">
      <h3 style="margin-bottom: 24px; font-weight: 800; font-size: 24px;">Question Review</h3>
      <div class="review-grid">
        ${reviewCards}
      </div>
      <div style="text-align: center; margin-top: 60px;">
        <button class="exit-btn" style="background:#64748b" onclick="confirmLeaveResults()">Finish & Close</button>
      </div>
    </div>
  `;

      let startValue = 0;
      const progressCircle = document.getElementById("progress-circle");
      const progressValue = progressCircle.querySelector(".progress-value");

      if (percentage === 0) {
        progressCircle.style.background = `conic-gradient(#f1f5f9 360deg, #f1f5f9 0deg)`;
        progressValue.textContent = `0%`;
        return;
      }

      let interval = 20;
      let progress = setInterval(() => {
        startValue++;
        progressValue.textContent = `${startValue}%`;
        progressCircle.style.background = `conic-gradient(${remarkColor} ${startValue * 3.6}deg, #f1f5f9 0deg)`;

        if (startValue == Math.round(percentage)) {
          clearInterval(progress);
        }
      }, interval);
    }

    document.querySelector(".submit-btn").addEventListener("click", requestSubmit);
  </script>
</body>

</html>
